        <div class="nav-menu" id="navMenu">
            <a href="/" class="nav-link" data-page="home">Home</a>
            <a href="/about" class="nav-link" data-page="about">About</a>
            <a href="/solutions" class="nav-link" data-page="solutions">Solutions</a>
            <a href="/domains" class="nav-link" data-page="domains" style="display: none;">Domains</a>

           <a href="/pricing" class="nav-link" data-page="pricing">Pricing</a>-->

            <span></span>

            <span></span>
        </button>

</nav>

<script>
    // Auto-detect active page and add active class
    document.addEventListener('DOMContentLoaded', function () {
        // Get current page path
        const currentPath = window.location.pathname;

        // Remove trailing slash for comparison
        const cleanPath = currentPath.replace(/\/$/, '') || '/';

        // Get all nav links
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach(link => {
            const linkPath = link.getAttribute('href').replace(/\/$/, '') || '/';

            // Check if current page matches link
            if (cleanPath === linkPath ||
                (cleanPath !== '/' && linkPath !== '/' && cleanPath.startsWith(linkPath))) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });

        // Special case for jobcard pages
        if (currentPath.includes('/jobcard')) {
            document.querySelector('.btn-nav')?.classList.add('active');
        }
    });
</script>
