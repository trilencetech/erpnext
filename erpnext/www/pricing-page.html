<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pricing — Our Solutions</title>
  <link rel="stylesheet" href="/assets/erpnext/css/website.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #151820;
      --surface2: #1c2030;
      --border: #272c3d;
      --ink: #eef0f6;
      --muted: #7a8099;
      --accent: #4f8ef7;
      --accent2: #f7c34f;
      --accent-glow: rgba(79,142,247,0.15);
      --gold: #f7c34f;
      --gold-glow: rgba(247,195,79,0.12);
    }

    body {
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── BG MESH ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(79,142,247,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(247,195,79,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }

    /* ─── HERO ─── */
    .hero {
      text-align: center;
      margin-bottom: 72px;
      
    }

    .hero-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: white;
      border: 1px solid white;
      border-radius: 40px;
      padding: 6px 18px;
      margin-bottom: 24px;
      background: rgba(79,142,247,0.06);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 20px;
      color: var(--ink);
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 36px;
      line-height: 1.75;
      font-weight: 300;
    }

    /* ─── DOMAIN SELECTOR ─── */
    .domain-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 56px;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .domain-pill {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 40px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .domain-pill:hover {
      border-color: var(--accent);
      color: var(--ink);
    }

    .domain-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 24px rgba(79,142,247,0.35);
    }

    /* ─── PRICING GRID ─── */
    .pricing-section { display: none; }
    .pricing-section.active {
      display: block;
      animation: fadeUp 0.4s ease both;
    }

    .domain-intro {
      text-align: center;
      margin-bottom: 40px;
    }

    .domain-intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .domain-intro p {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 300;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }

    /* ─── PLAN CARD ─── */
    .plan-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 36px 30px 32px;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    }

    .plan-card:hover {
      transform: translateY(-4px);
      border-color: rgba(79,142,247,0.4);
      box-shadow: 0 12px 48px rgba(0,0,0,0.3);
    }

    .plan-card.featured {
      background: linear-gradient(145deg, #172040, #0f1a35);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 20px 60px rgba(79,142,247,0.2);
    }

    .plan-card.featured:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 0 1px var(--accent), 0 28px 72px rgba(79,142,247,0.3);
    }

    .popular-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(79,142,247,0.4);
    }

    .plan-tier {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .plan-card.featured .plan-tier { color: var(--accent2); }

    .plan-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .plan-tagline {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 24px;
      line-height: 1.5;
      min-height: 40px;
    }

    .plan-price-block {
      background: var(--surface2);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 28px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .plan-card.featured .plan-price-block {
      background: rgba(79,142,247,0.08);
      border-color: rgba(79,142,247,0.2);
    }

    .price-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .price-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent2);
    }

    .price-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ─── FEATURES LIST ─── */
    .plan-features {
      list-style: none;
      flex: 1;
      margin-bottom: 28px;
    }

    .plan-features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      color: #b0b8cc;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      line-height: 1.5;
      font-weight: 300;
    }

    .plan-features li:last-child { border-bottom: none; }

    .feat-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(79,142,247,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 10px;
    }

    .plan-card.featured .feat-check {
      background: rgba(247,195,79,0.15);
      color: var(--gold);
    }

    /* ─── CTA BUTTON ─── */
    .plan-cta {
      display: block;
      width: 100%;
      text-align: center;
      padding: 13px 24px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.22s ease;
      border: none;
    }

    .cta-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
    }

    .cta-outline:hover {
      border-color: var(--accent);
      color: var(--ink);
      background: var(--accent-glow);
    }

    .cta-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px rgba(79,142,247,0.35);
    }

    .cta-primary:hover {
      background: #3a7ef5;
      box-shadow: 0 6px 28px rgba(79,142,247,0.5);
      transform: translateY(-1px);
    }

    .cta-gold {
      background: var(--gold);
      color: #1a1200;
      box-shadow: 0 4px 20px rgba(247,195,79,0.3);
    }

    .cta-gold:hover {
      background: #f5b820;
      box-shadow: 0 6px 28px rgba(247,195,79,0.45);
      transform: translateY(-1px);
    }

    .trust-item span:first-child { font-size: 18px; }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .pricing-grid { grid-template-columns: 1fr; max-width: 420px; margin-left: auto; margin-right: auto; }
    }

    @media (max-width: 540px) {
      .demo-banner { padding: 40px 24px; }
      .trust-strip { gap: 20px; }
    }

    .pricing-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 80px 0;
            color: white;
            text-align: center;
        }
        .pricing-hero1 {
            padding:80px 0;
            color: white;
            text-align: center;
        }
  </style>
</head>
<body>
  {% include "templates/includes/__navigation.html" %}
<div >

  <!-- ─── HERO ─── -->
  <div class="pricing-hero">
    <span class="hero-label">Flexible Pricing</span>
    <h1 style="font-size: 48px; font-weight: 800; margin-bottom: 20px;">Plans Built Around<br/><em>Your Business</em></h1>
    <p style="font-size: 20px; opacity: 0.9; max-width: 700px; margin: 0 auto; color: darkgray;">No one-size-fits-all. 
      Every domain has unique needs — so we tailor our plans to match your scale, complexity, and goals.</p>
  </div>
  <div class="pricing-hero1">
   <span >
      <a href="/contact" class="btn btn-primary" style="margin-top: 30px;">Request Quote</a>
    </span>
    </div>
</div>

<script>
  function switchDomain(domain, el) {
    document.querySelectorAll('.domain-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.pricing-section').forEach(s => s.classList.remove('active'));
    document.getElementById('pricing-' + domain).classList.add('active');
  }
</script>
{% include "templates/includes/__footer.html" %}
</body>
</html>
